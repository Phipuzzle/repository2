services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: intelligent-data-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: intelligent_data_agent
      POSTGRES_USER: ida
      POSTGRES_PASSWORD: ida
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ida -d intelligent_data_agent"]
      interval: 5s
      timeout: 5s
      retries: 10


  langfuse:
    image: langfuse/langfuse:2
    container_name: intelligent-data-agent-langfuse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ida:ida@postgres:5432/langfuse
      NEXTAUTH_SECRET: local-dev-secret-change-me
      SALT: local-dev-salt-change-me
      NEXTAUTH_URL: http://localhost:3001
      TELEMETRY_ENABLED: "false"
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
