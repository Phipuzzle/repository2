name: Evaluation

on:
  pull_request:
  push:
    branches:
      - master
      - "feat/**"
      - "test/**"

jobs:
  evaluation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: intelligent_data_agent
          POSTGRES_USER: ida
          POSTGRES_PASSWORD: ida
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ida -d intelligent_data_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://ida:ida@localhost:5432/intelligent_data_agent
      OIDC_ISSUER: http://localhost:8080/realms/ida
      OIDC_AUDIENCE: intelligent-data-agent-api
      OIDC_JWKS_URL: http://localhost:8080/realms/ida/protocol/openid-connect/certs
      AGENT_ENABLED: "true"
      EMBEDDING_PROVIDER: hash
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run database migrations and seed data
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python scripts/seed_demo_data.py
          python scripts/provision_dev_oidc_user.py

      - name: Lint and unit tests
        working-directory: backend
        run: |
          python -m ruff check app tests evals scripts
          python -m pytest -q

      - name: Validate golden SQL offline
        working-directory: backend
        run: python -m evals.run_evaluation --self-check

      - name: Run accuracy evaluation
        if: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        working-directory: backend
        run: python -m evals.run_evaluation --threshold 0.8

      - name: Archive evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: backend/evals/results.json
          if-no-files-found: ignore
